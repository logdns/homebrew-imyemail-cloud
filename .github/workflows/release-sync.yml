name: Sync both edition releases

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions: {}

concurrency:
  group: edition-release-sync
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  update-casks:
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Verify and prepare both cask updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/test-sync-editions.py
          python3 scripts/sync-editions.py
      - name: Audit new definitions
        run: |
          brew style --cask "$GITHUB_REPOSITORY/imyemail-cloud-native" "$GITHUB_REPOSITORY/imyemail-cloud-mygo"
          brew audit --cask --strict "$GITHUB_REPOSITORY/imyemail-cloud-native" "$GITHUB_REPOSITORY/imyemail-cloud-mygo"
      - name: Open verified update PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain -- Casks README.md README.zh-CN.md)" || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="automation/editions-$GITHUB_RUN_ID"
          git switch -c "$branch"
          git add Casks/imyemail-cloud-native.rb Casks/imyemail-cloud-mygo.rb README.md README.zh-CN.md
          git commit -m 'Update independently verified native and MyGo releases'
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title 'Update native and MyGo casks' \
            --body 'Both release tracks verified with pinned certificate fingerprint, signed manifest and recomputed package hashes. Review cask CI before merging.'
          gh workflow run tests.yml --ref "$branch"
