name: Both cask checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  cask:
    name: ${{ matrix.token }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { token: imyemail-cloud-native, runner: macos-14, arch: arm64, id: email.imy.cloud, exe: ChckMail }
          - { token: imyemail-cloud-mygo, runner: macos-14, arch: arm64, id: email.imy.cloud.mygo, exe: imyemail-cloud-mygo }
          - { token: imyemail-cloud-mygo, runner: macos-15-intel, arch: x86_64, id: email.imy.cloud.mygo, exe: imyemail-cloud-mygo }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Verify independent selection and tamper rejection
        run: python3 scripts/test-sync-editions.py
      - name: Audit and style
        run: |
          brew style --cask "$GITHUB_REPOSITORY/${{ matrix.token }}"
          brew audit --cask --strict "$GITHUB_REPOSITORY/${{ matrix.token }}"
          brew livecheck --cask "$GITHUB_REPOSITORY/${{ matrix.token }}"
      - name: Install with independent short token
        run: |
          brew trust --tap "$GITHUB_REPOSITORY"
          brew install --cask '${{ matrix.token }}'
      - name: Verify installed identity, architecture, version and signer
        run: |
          set -euo pipefail
          app='/Applications/${{ matrix.token }}.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = '${{ matrix.id }}'
          version=$(brew info --cask --json=v2 "$GITHUB_REPOSITORY/${{ matrix.token }}" | jq -r '.casks[0].version')
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          file "$app/Contents/MacOS/${{ matrix.exe }}" | grep -F '${{ matrix.arch }}'
          codesign --verify --deep --strict "$app"
          codesign -d --extract-certificates="$RUNNER_TEMP/edition-leaf" "$app"
          fingerprint=$(openssl x509 -inform DER -in "$RUNNER_TEMP/edition-leaf0" -outform DER | shasum -a 256 | awk '{print $1}')
          test "$fingerprint" = 476ea6e573714e9c46a43471b5938d791e1c3851beb7b3eef8269cf084f48548
          test -L "$(brew --prefix)/bin/${{ matrix.token }}"
      - name: Verify both editions install side by side
        if: matrix.token == 'imyemail-cloud-native'
        run: |
          brew install --cask imyemail-cloud-mygo
          test -d /Applications/imyemail-cloud-native.app
          test -d /Applications/imyemail-cloud-mygo.app
          test -L "$(brew --prefix)/bin/imyemail-cloud-native"
          test -L "$(brew --prefix)/bin/imyemail-cloud-mygo"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' /Applications/imyemail-cloud-mygo.app/Contents/Info.plist)" = email.imy.cloud.mygo
      - name: Uninstall without deleting accounts or unrelated dependencies
        run: |
          brew uninstall --cask '${{ matrix.token }}'
          test ! -e '/Applications/${{ matrix.token }}.app'
      - name: Verify native removal preserves MyGo then remove fixture installation
        if: matrix.token == 'imyemail-cloud-native'
        run: |
          test -d /Applications/imyemail-cloud-mygo.app
          test -L "$(brew --prefix)/bin/imyemail-cloud-mygo"
          brew uninstall --cask imyemail-cloud-mygo
          test ! -e /Applications/imyemail-cloud-mygo.app
      - name: Style retained legacy cask
        if: matrix.token == 'imyemail-cloud-native'
        run: brew style --cask "$GITHUB_REPOSITORY/imyemail-cloud"
