name: cask checks

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  cask:
    runs-on: macos-14
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit and style
        run: |
          brew style --cask "$GITHUB_REPOSITORY/imyemail-cloud"
          brew audit --cask --strict "$GITHUB_REPOSITORY/imyemail-cloud"
          brew livecheck --cask "$GITHUB_REPOSITORY/imyemail-cloud"

      - name: Install with the public short command
        run: |
          brew trust --tap "$GITHUB_REPOSITORY"
          brew install imyemail-cloud

      - name: Verify installed application and CLI
        run: |
          test -d /Applications/imyemail-cloud.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' /Applications/imyemail-cloud.app/Contents/Info.plist)" = email.imy.cloud
          expected_version=$(brew info --cask --json=v2 "$GITHUB_REPOSITORY/imyemail-cloud" | jq -r '.casks[0].version')
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/imyemail-cloud.app/Contents/Info.plist)" = "$expected_version"
          file /Applications/imyemail-cloud.app/Contents/MacOS/ChckMail | grep -F 'arm64'
          codesign --verify --deep --strict --verbose=2 /Applications/imyemail-cloud.app
          codesign -dv --verbose=4 /Applications/imyemail-cloud.app 2>&1 | grep -F 'Signature=adhoc'
          test -L "$(brew --prefix)/bin/imyemail-cloud"

      - name: Uninstall
        run: |
          brew uninstall imyemail-cloud
          test ! -e /Applications/imyemail-cloud.app
